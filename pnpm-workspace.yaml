packages:
  - 'apps/*'
  - 'packages/*'

# Versiones compartidas por los cuatro paquetes. Se declaran como "catalog:"
# en cada package.json: subir de versión es una línea, no cuatro archivos.
catalog:
  typescript: ^6.0.3
  '@types/node': ^24.0.0

# pnpm 11: los ajustes viven aquí, no en .npmrc (que solo guarda auth y registry).
# Sin `engineStrict` el install avisaría en vez de fallar.
engineStrict: true

# Sustituye a `onlyBuiltDependencies`, eliminado en v11. Solo estos paquetes pueden
# ejecutar scripts de instalación; el resto falla con ERR_PNPM_IGNORED_BUILDS.
# Prisma lo necesita: su postinstall es lo que genera el cliente.
allowBuilds:
  prisma: true              # genera el cliente en el postinstall
  '@prisma/client': true
  '@prisma/engines': true   # descarga los binarios del query engine
  esbuild: true             # lo usan tsx y vitest
  # Telemetría que viaja con @nestjs/swagger vía swagger-ui-dist. Denegado a
  # propósito: no queremos un postinstall que reporte nada.
  '@scarf/scarf': false
  # Su postinstall instala el service worker para el modo NAVEGADOR de msw.
  # Nosotros usamos setupServer en Node, así que no hace falta.
  msw: false

# Las tres advisories de lodash y la de deepmerge-ts llegan por el CLI de Prisma
# (Studio y su cargador de config). Prisma las arrastra como peer opcional, así que
# acaban también en el árbol de `pnpm deploy --prod`. Se fuerzan a las parcheadas.
overrides:
  lodash: '>=4.18.1'
  deepmerge-ts: '>=8.0.0'
  # `qs` SÍ está en el camino de una petición: es quien parsea la query string
  # de Express, y los controllers públicos los llama el navegador de cualquiera.
  qs: '>=6.16.0'
  # `mysql2` llega por el CLI de Prisma y en este proyecto NO se carga nunca
  # —es PostgreSQL con el adaptador `PrismaPg`—, pero acaba en el árbol de
  # `pnpm deploy --prod` igual, así que se fuerza a la parcheada en vez de
  # dejar un aviso que se aprende a ignorar.
  mysql2: '>=3.23.1'
