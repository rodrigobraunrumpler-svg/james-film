<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="James Film">
  <!--
    La tira de película de la marca (`Marca.astro`), redibujada para 16 px.

    NO es el mismo SVG, y no puede serlo: el de la cabecera son trazos de 1,2 px
    sobre 24, y a tamaño de pestaña esas cuatro líneas se funden en una mancha.
    Aquí todo son formas RELLENAS, con pocos elementos y grandes, que es lo que
    sobrevive al reescalado.

    Se eligió MIRÁNDOLO a 16, 24, 32 y 64 contra una variante con seis
    perforaciones y otra con cuatro: las dos se vuelven ruido por debajo de 24,
    y una de ellas se lee como un dado. Esta aguanta porque el hueco central
    oscuro le da figura y fondo.

    Lleva su propio fondo `void` en vez de ser transparente: la barra de
    pestañas es clara u oscura según el sistema, y el latón sobre blanco da
    1.8:1. Con el fondo puesto se ve igual en los dos.

    MARCADOR: James tiene que dar su logo en SVG. Hasta entonces, este dibujo.
  -->
  <rect width="32" height="32" rx="7" fill="#0A0908" />
  <rect x="3" y="6" width="26" height="20" rx="3" fill="#C9A96A" />
  <rect x="9" y="11" width="14" height="10" rx="1.5" fill="#0A0908" />
  <g fill="#0A0908">
    <rect x="5" y="8" width="2.5" height="2.5" rx="0.7" />
    <rect x="24.5" y="8" width="2.5" height="2.5" rx="0.7" />
    <rect x="5" y="21.5" width="2.5" height="2.5" rx="0.7" />
    <rect x="24.5" y="21.5" width="2.5" height="2.5" rx="0.7" />
  </g>
</svg>
