<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Inter, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #0F0D0C;
      color: #F2EFE9;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
  </style>
</helmet>

<!-- 390x844 — el iPhone de James. Es el dispositivo real de trabajo: sube desde el evento. -->
<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #0F0D0C; overflow: hidden;">

  <!-- Barra de estado -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 6px; font-size: 12px; font-weight: 500;">
    <span>21:14</span>
    <div style="display: flex; align-items: center; gap: 5px; color: #8E877E;">
      <svg width="15" height="11" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 14h2M8 10v4M14 6v8M20 2v12"/></svg>
      <svg width="16" height="11" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="20" height="12" rx="3"/><rect x="3" y="3" width="12" height="8" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 5v4" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- Cabecera: menú en drawer bajo lg, no sidebar -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 6px 16px 12px;">
    <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: #F2EFE9; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <span style="font-size: 17px; font-weight: 600; overflow-wrap: anywhere;">XV de Camila</span>
      <span style="color: #8E877E; font-size: 11px;">Borrador · 12 reels · 4 fotos</span>
    </div>
    <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: auto; margin-right: -10px; border: 0; background: transparent; color: #8E877E; cursor: pointer;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
    </button>
  </div>

  <!-- Pestañas del editor -->
  <div style="display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid #262220;">
    <div style="display: flex; align-items: center; gap: 6px; height: 40px; border-bottom: 2px solid #C9A96A;">
      <span style="font-weight: 500;">Medios</span><span style="color: #8E877E; font-size: 12px;">16</span>
    </div>
    <div style="display: flex; align-items: center; height: 40px; border-bottom: 2px solid transparent; color: #8E877E;">Datos</div>
    <div style="display: flex; align-items: center; height: 40px; border-bottom: 2px solid transparent; color: #8E877E;">Portada</div>
  </div>

  <!-- Grilla de medios 3:4, dos columnas: en 390px tres serían miniaturas ilegibles -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; padding: 14px 16px 0;">

    <!-- Subiendo: relleno de latón subiendo DENTRO de la miniatura, con el % centrado -->
    <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 8px; background: linear-gradient(170deg, #1C1712 0%, #100D0B 60%, #080706 100%); border: 1px solid #3D362F; overflow: hidden;">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 62%; background: rgba(201,169,106,.20);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 62%; height: 1px; background: #C9A96A;"></div>
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #F2EFE9;">62%</div>
    </div>

    <!-- Fallo: el mensaje dice qué hacer -->
    <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 8px; background: #1A1211; border: 1px solid #7A3B3B; overflow: hidden;">
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 12px; text-align: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C87676" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
        <span style="color: #C87676; font-size: 11px; line-height: 1.45;">Es 4K.<br>Expórtalo a 1080p.</span>
        <span style="margin-top: 2px; padding: 4px 9px; border-radius: 5px; border: 1px solid #3D362F; color: #F2EFE9; font-size: 11px;">Reintentar</span>
      </div>
    </div>

    <!-- Portada -->
    <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 8px; background: linear-gradient(165deg, #2A2118 0%, #171310 55%, #080706 100%); border: 1px solid #C9A96A; overflow: hidden;">
      <span style="position: absolute; top: 7px; left: 7px; padding: 3px 7px; border-radius: 4px; background: rgba(8,7,6,.82); color: #C9A96A; font-size: 10px;">Portada</span>
      <span style="position: absolute; bottom: 7px; right: 7px; padding: 3px 6px; border-radius: 4px; background: rgba(8,7,6,.82); font-size: 10px;">0:24</span>
    </div>

    <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 8px; background: linear-gradient(165deg, #1B2621 0%, #101614 55%, #080706 100%); border: 1px solid #262220; overflow: hidden;">
      <span style="position: absolute; bottom: 7px; right: 7px; padding: 3px 6px; border-radius: 4px; background: rgba(8,7,6,.82); font-size: 10px;">0:18</span>
    </div>

    <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 8px; background: linear-gradient(165deg, #262029 0%, #141017 55%, #080706 100%); border: 1px solid #262220; overflow: hidden;">
      <span style="position: absolute; bottom: 7px; right: 7px; padding: 3px 6px; border-radius: 4px; background: rgba(8,7,6,.82); font-size: 10px;">0:31</span>
    </div>

    <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 8px; background: linear-gradient(165deg, #2A231A 0%, #16120D 55%, #080706 100%); border: 1px solid #262220; overflow: hidden;">
      <span style="position: absolute; top: 7px; left: 7px; padding: 3px 6px; border-radius: 4px; background: rgba(8,7,6,.82); color: #8E877E; font-size: 10px;">FOTO</span>
    </div>
  </div>

  <!-- Bandeja de subidas persistente. Sticky, no fixed: no tapa el botón de abajo. -->
  <div style="margin-top: auto; background: #151311; border-top: 1px solid #262220;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9A96A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <span style="font-size: 12px;">Subiendo 3 de 8</span>
        <span style="color: #8E877E; font-size: 11px;">Quedan ~2 min · no cierres esta pantalla</span>
      </div>
      <span style="margin-left: auto; color: #8E877E; font-size: 11px;">62%</span>
    </div>
    <div style="height: 2px; background: #262220;">
      <div style="width: 44%; height: 100%; background: #C9A96A;"></div>
    </div>

    <!-- Acciones: 44px de alto, dedo gordo, dentro del área segura -->
    <div style="display: flex; gap: 10px; padding: 12px 16px 30px;">
      <button style="display: flex; align-items: center; justify-content: center; gap: 7px; flex: 1; height: 44px; border-radius: 8px; background: transparent; border: 1px solid #C9A96A; color: #C9A96A; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Añadir
      </button>
      <button style="display: flex; align-items: center; justify-content: center; flex: 1; height: 44px; border-radius: 8px; background: #221E1A; border: 1px solid #3D362F; color: #F2EFE9; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">
        Publicar
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
