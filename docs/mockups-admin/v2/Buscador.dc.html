<helmet>
<title>Buscador ⌘K</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:13px;background:#0F0D0C;color:#F2EFE9;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  .h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;}
  .disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.02em;}
  .sub{color:#8E877E;font-size:12px;margin:2px 0 0;}
  .lab{color:#5F5952;font-size:11px;}
  .card{background:#171412;border:1px solid #262220;border-radius:8px;}
  .chip{border-radius:4px;background:#221E1A;color:#8E877E;padding:2px 7px;font-size:10px;}
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;background:#171412;border:1px solid #3D362F;color:#F2EFE9;font:inherit;font-size:12px;font-weight:500;transition:border-color .15s,background-color .15s;}
  .btn:hover{border-color:#4A4038;background:#1C1917;}
  .btn-b{background:transparent;border-color:#C9A96A;color:#C9A96A;}
  .btn-b:hover{background:rgba(201,169,106,.1);border-color:#C9A96A;}
  .campo{display:flex;align-items:center;height:34px;padding:0 10px;border-radius:6px;background:#171412;border:1px solid #262220;}
  .num{font-variant-numeric:tabular-nums;}

  /* Entrada escalonada: el orden en que aparecen es el orden en que hay que
     leerlos. Solo transform y opacity, ≤350ms. */
  @keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes creceX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes creceY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes aparece{from{opacity:0}to{opacity:1}}
  @keyframes deriva{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.05)}}
  @media (prefers-reduced-motion: no-preference){
    .e{animation:sube .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
    .bar{transform-origin:left center;animation:creceX .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(220ms + var(--i,0)*60ms)}
    .col{transform-origin:bottom;animation:creceY .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(260ms + var(--i,0)*22ms)}
    .luz{animation:aparece .4s ease both, deriva 24s ease-in-out .4s infinite alternate}
  }
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

  /* La fila y la tarjeta se levantan al pasar por encima: dice «esto se puede
     tocar» sin añadir un botón más. */
  .lift{transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,background-color .2s;}
  .lift:hover{transform:translateY(-2px);border-color:#4A4038;background:#1C1917;}
</style>
</helmet>

<div style="position:relative;width:920px;height:660px;background:#0F0D0C;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;">
  <!-- El panel de detrás, atenuado: la paleta no te saca de donde estás. -->
  <div aria-hidden="true" style="position:absolute;inset:0;opacity:.28;filter:blur(1.5px);display:flex;">
    <div style="width:200px;background:#151311;border-right:1px solid #262220;"></div>
    <div style="flex:1;padding:24px;display:flex;flex-direction:column;gap:12px;">

        <div style="aspect-ratio:4/3;border-radius:8px;background:#171412;border:1px solid #262220;"></div>
      </div>
    </div>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(8,7,6,.62);"></div>

  <div class="e" style="--i:0;position:relative;width:520px;margin-top:88px;border-radius:10px;border:1px solid #3D362F;background:#151311;box-shadow:0 26px 64px rgba(0,0,0,.62);overflow:hidden;">
    <div style="display:flex;align-items:center;gap:10px;height:46px;padding:0 15px;border-bottom:1px solid #262220;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5F5952" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

    <div style="max-height:400px;padding-bottom:6px;"><div class="lab" style="padding:11px 15px 5px;text-transform:uppercase;letter-spacing:.1em;">Ir a</div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;background:#221E1A;box-shadow:inset 2px 0 0 #C9A96A;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C9A96A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L3 21"/></svg><span style="color:#F2EFE9;">Galerías</span><span class="num" style="margin-left:auto;color:#5F5952;font-size:11px;">14</span></div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5F5952" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg><span style="color:#8E877E;">Categorías</span><span class="num" style="margin-left:auto;color:#5F5952;font-size:11px;">4</span></div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5F5952" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span style="color:#8E877E;">Configuración › Contacto</span></div><div class="lab" style="padding:11px 15px 5px;text-transform:uppercase;letter-spacing:.1em;">Galerías</div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;"><span style="width:15px;height:20px;border-radius:2px;flex-shrink:0;background:radial-gradient(110% 80% at 50% 25%,#3D2B2B,#1A1212 60%,#080706);"></span><span style="color:#8E877E;">XV de Camila</span><span class="num" style="margin-left:auto;color:#5F5952;font-size:11px;">2 fallidos</span></div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;"><span style="width:15px;height:20px;border-radius:2px;flex-shrink:0;background:radial-gradient(110% 80% at 50% 25%,#3D2B2B,#1A1212 60%,#080706);"></span><span style="color:#8E877E;">Boda Rojas</span><span class="num" style="margin-left:auto;color:#5F5952;font-size:11px;">borrador</span></div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;"><span style="width:15px;height:20px;border-radius:2px;flex-shrink:0;background:radial-gradient(110% 80% at 50% 25%,#3D2B2B,#1A1212 60%,#080706);"></span><span style="color:#8E877E;">Cumple de Nico</span><span class="num" style="margin-left:auto;color:#5F5952;font-size:11px;">publicada</span></div><div class="lab" style="padding:11px 15px 5px;text-transform:uppercase;letter-spacing:.1em;">Hacer</div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5F5952" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span style="color:#8E877E;">Nueva galería</span></div><div class="lift" style="display:flex;align-items:center;gap:11px;height:36px;padding:0 15px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5F5952" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span style="color:#8E877E;">Publicar los 3 cambios</span></div></div>

    <div style="display:flex;align-items:center;gap:14px;height:34px;padding:0 15px;border-top:1px solid #262220;background:#0F0D0C;color:#5F5952;font-size:11px;">
      <span>↑↓ moverse</span><span>↵ abrir</span>
      <span style="margin-left:auto;">Busca galerías, paquetes y pantallas</span>
    </div>
  </div>
</div>
