services:
  db:
    image: postgres:17-alpine
    container_name: jamesfilm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jamesfilm
      POSTGRES_PASSWORD: jamesfilm
      POSTGRES_DB: jamesfilm
    ports:
      # 5433 en el host: evita el choque con un Postgres instalado localmente
      - '5433:5432'
    volumes:
      - jamesfilm-pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jamesfilm -d jamesfilm']
      interval: 5s
      timeout: 3s
      retries: 10

  # R2 es S3-compatible, así que MinIO en local y en CI ejercita EXACTAMENTE el
  # mismo código que correrá en producción: solo cambia el endpoint.
  storage:
    # MinIO se baja de QUAY, no de Docker Hub, y fijado por digest.
    #
    # MinIO BORRÓ sus repositorios de Docker Hub entre el 9 y el 12 de septiembre de
    # 2026, y el error despista: dice «pull access denied ... may require docker
    # login», que suena a permisos, cuando el repositorio simplemente ya no existe.
    # Ninguna credencial lo arregla. Tumbó el CI entero, incluidos los PR de
    # Dependabot, sin que ningún commit lo hubiera tocado.
    #
    # Quay conserva las imágenes y `latest` está CONGELADO en 2025-09-07: desde
    # octubre de 2025 la edición comunidad es solo código fuente. Se fija por digest
    # igual que la base de node en el Dockerfile — una etiqueta que hoy no se mueve
    # puede moverse el día que alguien reanude las publicaciones.
    #
    # Y esto NO toca producción: allí el almacenamiento es R2. MinIO solo reproduce
    # su API en local y en CI, que es lo que permite probar el flujo de subida
    # firmado entero sin una cuenta de Cloudflare.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: jamesfilm-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jamesfilm
      MINIO_ROOT_PASSWORD: jamesfilm-secreto
    ports:
      - '9000:9000'   # API S3
      - '9001:9001'   # consola web
    volumes:
      - jamesfilm-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 15

  # Un solo uso: crea el bucket y lo deja LEGIBLE sin credenciales.
  #
  # Esto último no es una relajación de seguridad, es reproducir producción: allí
  # los objetos se sirven por el dominio `media.` de R2, que es público, y
  # `CDN_BASE_URL` apunta ahí. En local esa variable apunta a MinIO directamente,
  # y un bucket de MinIO nace PRIVADO — así que cada `<img>` recibía un 403 y la
  # galería se veía vacía sin un solo error en la consola de la API.
  #
  # `anonymous set download` es solo LECTURA: escribir sigue exigiendo la firma,
  # que es exactamente el reparto que hay en producción.
  #
  # El CORS no hace falta declararlo: MinIO responde a cualquier origen por
  # defecto, y el PUT firmado desde el navegador ya funciona. En R2 sí hay que
  # configurarlo a mano para el origen del admin.
  storage-init:
    # Mismo motivo que arriba: Quay, y por digest.
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: jamesfilm-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 jamesfilm jamesfilm-secreto &&
      mc mb --ignore-existing local/jamesfilm &&
      mc anonymous set download local/jamesfilm &&
      echo 'bucket jamesfilm listo y legible'
      "

volumes:
  jamesfilm-pgdata:
  jamesfilm-minio:
